name: Live editor baseline
on:
  push:
    branches: [fix/editor-reliability-performance]
    paths: [.github/workflows/editor-baseline-retry.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare browser tests against unchanged editor
        shell: python
        run: |
          import json,zlib,base64,pathlib,re
          source=pathlib.Path('.github/workflows/editor-baseline.yml').read_text(encoding='utf-8')
          payload=re.search("payload = '([^']+)'",source).group(1)
          for path,content in json.loads(zlib.decompress(base64.b64decode(payload))).items():
              assert path in ['packages/app/benchmark/editor-smoke.html','packages/app/benchmark/editor-smoke.tsx','scripts/run-editor-smoke.mjs']
              target=pathlib.Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content.replace('Add Rectangle','Add Process'),encoding='utf-8')
      - run: node scripts/run-editor-smoke.mjs
