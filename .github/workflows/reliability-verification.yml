name: Reliability regression verification

on:
  push:
    branches: [fix/editor-reliability-performance]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locate reviewed execution paths
        shell: bash
        run: |
          grep -nE 'new OperationEngine|releaseGesture|requestLayout|requestBeautyPass|renderBackground|renderOverlay|renderMain|new SceneViewportRenderer|function DiagramCanvas|function OpenChart' packages/app/src/openchart-editor.tsx
          grep -nE 'class OperationEngine|constructor|history|undoStack|redoStack|appliedTransactions' packages/ops/src/index.ts
      - run: npm ci
      - name: Run regression tests
        run: npx vitest run packages/app/test/layout-worker-client.test.ts packages/app/test/live-session-retention.test.ts --reporter=verbose
