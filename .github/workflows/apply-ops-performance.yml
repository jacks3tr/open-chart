name: Apply verified operation performance follow-up
on:
  push:
    branches: [fix/editor-reliability-performance]
    paths: [.github/workflows/apply-ops-performance.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jacks3tr/open-chart'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, subprocess, tempfile
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '94a3ddc1fa02b1eb636c16542afd4052c7b1c80d01f3cd6bcd62fded6a800135'
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch)
              f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', '--index', f.name], check=True)
          helper = '.github/workflows/apply-ops-performance.yml'
          subprocess.run(['git', 'rm', helper], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '1e575cb0dbf269be16d5c8bfe822cf4076523824', tree
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', helper], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'perf: avoid unrelated draft traversal during deletion and calibrate cold layout'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/editor-reliability-performance'], check=True)
          PY
