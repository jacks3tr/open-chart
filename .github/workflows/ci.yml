name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:icons
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  fuzz:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fuzz:smoke

  performance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: .openchart-benchmarks/*.json
          if-no-files-found: warn

  editor:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:editor

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build frontend assets for native context
        run: npm run build --workspace @openchart/app
      - name: Test native persistence
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Windows desktop application
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-verification
          path: apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

  # Keep a single stable required-check name; no failed or skipped gate is hidden.
  check:
    if: always()
    needs: [quality, integration, fuzz, performance, editor, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              print('Unsuccessful gates: ' + ', '.join(failed))
              sys.exit(1)
          print('All verification gates passed')
          PYTHON
