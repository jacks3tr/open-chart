name: Prepare verification workspace

on:
  push:
    branches: [fix/editor-reliability-performance]
    paths: [.github/workflows/workspace-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package isolated source and installed test dependencies
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/openchart-workspace.tar.gz .
          tar -czf /tmp/openchart-node.tar.gz -C "$(dirname "$(command -v node)")" node
      - uses: actions/upload-artifact@v4
        with:
          name: openchart-verification-workspace
          path: |
            /tmp/openchart-workspace.tar.gz
            /tmp/openchart-node.tar.gz
          retention-days: 1
          if-no-files-found: error
