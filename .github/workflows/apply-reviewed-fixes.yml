name: Apply reviewed maintenance patch
on:
  push:
    branches: [fix/editor-reliability-performance]
    paths: [.github/workflows/apply-reviewed-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify baseline and apply the exact reviewed source patch
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/editor-reliability-performance'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == 'f6f9f2ac4e753ed827e71fcac437535289904547'
          assert git('ls-remote', 'origin', 'refs/heads/fix/editor-reliability-performance').split()[0] == os.environ['GITHUB_SHA']
          payload = (
            ''
            ''
            ''
          )
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'f3141f1651573a2dc9ddaf9846e6fae21ca15cb0eea14c9370288900c5f403bb'
          target = pathlib.Path('/tmp/openchart-reviewed.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          expected = {'docs/PHASE_9_PLAN.md','docs/superpowers/plans/2026-09-05-editor-reliability.md','package.json','packages/agent/test/arcline-acceptance.test.ts','packages/agent/test/mcp-contract.test.ts','packages/agent/test/timing.ts','packages/app/benchmark/editor-smoke.html','packages/app/benchmark/editor-smoke.tsx','packages/app/src/canvas-layer.ts','packages/app/src/layout-worker-client.ts','packages/app/src/live-document-session.ts','packages/app/src/openchart-editor.tsx','packages/app/test/layout-worker-client.test.ts','packages/app/test/live-document-session.test.ts','packages/ops/src/index.ts','packages/ops/test/checkpoint.test.ts','packages/render/src/text-raster-cache.ts','packages/render/test/text-raster-cache.test.ts','scripts/run-editor-smoke.mjs'}
          assert set(git('diff','--cached','--name-only').splitlines()) == expected
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'fix: harden editor cancellation, rendering, workers, and persistence')
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/editor-reliability-performance'], check=True)
          print('Reviewed patch published at ' + git('rev-parse','HEAD'))
