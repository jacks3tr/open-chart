name: Editor baseline regression verification
on:
  push:
    branches: [fix/editor-reliability-performance]
    paths: [.github/workflows/editor-baseline.yml]
permissions:
  contents: read
jobs:
  editor-baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Materialize reviewed browser regression harness
        shell: python
        run: |
          import json,zlib,base64,pathlib
          payload = ''
          for path,content in json.loads(zlib.decompress(base64.b64decode(payload))).items():
              target=pathlib.Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
      - name: Reproduce live editor failures
        run: node scripts/run-editor-smoke.mjs
